[package]
name = "tiny-lsm"
version = "0.2.0"
edition = "2024"
description = "Compact LSM-tree key-value engine in Rust, derived from Mini-LSM."
license = "Apache-2.0"
readme = "README.md"
keywords = ["storage", "database", "lsm", "lsm-tree", "kv"]
categories = ["database"]
publish = false
documentation = "https://skyzh.github.io/mini-lsm"
homepage = "https://github.com/skyzh/mini-lsm"

[dependencies]
anyhow = "1"
arc-swap = "1"
bytes = "1"
crossbeam-epoch = "0.9"
crossbeam-skiplist = "0.1"
parking_lot = "0.12"
ouroboros = "0.18"
moka = { version = "0.12", features = ["sync"] }
clap = { version = "4", features = ["derive"] }
rand = "0.10"
crossbeam-channel = "0.5"
serde_json = { version = "1" }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
farmhash = "1"
nom = "8"
rustyline = "17"

[dev-dependencies]
tempfile = "3"
